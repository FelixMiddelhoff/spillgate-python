name: release

# Publishes to PyPI with Trusted Publishing (OpenID Connect): no API token is stored anywhere.
# It runs only for a tag like v0.1.0 that the maintainer pushes, builds exactly once, checks
# that the tag equals the package version, tests the built wheel in a clean environment and
# then publishes the same files from a protected environment.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.13" }
      - run: python -m pip install build twine pytest hypothesis "brotli>=1.2.1,<2" "zstandard>=0.25.0,<1"
      - name: the tag must equal the package version
        run: |
          version=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != version $version"; exit 1; }
      - name: the full suite passes, nothing skipped
        run: python -m pytest
        env:
          SPILLGATE_NO_SKIPS: "1"
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: the wheel works in a clean environment
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/python -m pip install dist/*.whl
          /tmp/clean/bin/python -I -c "import spillgate; print(spillgate.Limits(max_output=1))"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    # The environment "pypi" is created in the repository settings and requires the maintainer's
    # approval before this job runs. The PyPI project trusts exactly this workflow and
    # environment (see RELEASING.md).
    environment:
      name: pypi
      url: https://pypi.org/p/spillgate
    permissions:
      id-token: write # the only permission that lets this job publish
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        # Attestations (build provenance) are produced by default and uploaded with the files.
