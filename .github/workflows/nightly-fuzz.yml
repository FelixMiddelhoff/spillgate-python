name: nightly-fuzz

# Property tests with a much larger example budget than the pull-request run.
on:
  schedule:
    - cron: "27 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hypothesis:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.13" }
      - run: python -m pip install pytest hypothesis
      - name: properties with a large budget
        run: python -m pytest tests/test_properties.py
        env:
          SPILLGATE_HYPOTHESIS_EXAMPLES: "200000"
