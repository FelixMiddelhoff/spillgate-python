name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "${{ matrix.python }}" }
      - run: python -m pip install pytest hypothesis "brotli>=1.2.1,<2" "zstandard>=0.25.0,<1"
      - name: tests (all 354 conformance vectors with brotli and zstd, properties, traps)
        run: python -m pytest
        env:
          SPILLGATE_NO_SKIPS: "1"  # a missing codec fails the run instead of skipping vectors
  core-only:
    # The core must work and test cleanly without any optional dependency.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.11" }
      - run: python -m pip install pytest hypothesis
      - run: python -m pytest -m "not large"
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.13" }
      - run: python -m pip install pip-audit "brotli>=1.2.1,<2" "zstandard>=0.25.0,<1"
      - name: known vulnerabilities in the optional dependencies
        run: python -m pip_audit

  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.13" }
      - run: python -m pip install ruff mypy pytest hypothesis build brotli zstandard
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy
      - name: every rule of the specification is covered
        run: python tools/spectrace.py
      - name: the package builds and installs into a clean environment
        run: |
          python -m build
          python -m venv /tmp/clean
          /tmp/clean/bin/python -m pip install dist/*.whl
          /tmp/clean/bin/python -I -c "import spillgate; print(spillgate.Limits(max_output=1))"
